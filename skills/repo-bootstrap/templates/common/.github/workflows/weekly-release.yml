# Once a week, releases the next patch version when every commit since the
# latest vX.Y.Z tag, merge commits aside, is Renovate's and they changed
# something that goes into a release. .github/scripts/plan-release.sh decides
# and logs why; otherwise the run ends without a release, and the release is
# left to a tag pushed by hand.
#
# A tag pushed with the run's GITHUB_TOKEN starts no workflow, so this calls
# release.yml itself with the version. release.yml builds from this commit and
# pushes the tag only once everything is built, so a failed build leaves no
# tag behind.
name: weekly release

on:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 JST
  workflow_dispatch:

permissions: {}

# Two runs at once would both try to release the same version.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      message: ${{ steps.plan.outputs.message }}
    steps:
      # The whole history and the tags, to find the latest tag and the
      # commits after it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        run: .github/scripts/plan-release.sh

  release:
    needs: plan
    if: needs.plan.outputs.version != ''
    # The ceiling for everything release.yml does. Remove packages: write when
    # it publishes no image.
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      message: ${{ needs.plan.outputs.message }}
