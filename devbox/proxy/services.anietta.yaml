# Services this devbox publishes on https://<name>.oeilvert.dev.
#
# One file per host, the way ~/.zshrc.<hostname> is; boucherie gets its own.
# This is the whole configuration -- devbox-proxy reads it directly and nothing
# is generated from it any more -- so adding a service is: add it below, run
# `devbox-proxy reload`. Nothing outside this devbox is touched. docs/adr/0004.
#
# Nothing here is secret. Viewers are GitHub account names, which are public;
# the signing key and the GitHub client secret live under $HOME and never
# appear in this repository. docs/adr/0007.

zone: oeilvert.dev

defaults:
  # Services that do not say otherwise ask for a GitHub login.
  auth: required

# A service name is one DNS label -- llama, not llama.gpu. The wildcard AAAA
# record covers exactly one level (docs/adr/0006). `auth` is reserved: it is
# the host the login itself happens on.
#
#   - name: llama              # https://llama.oeilvert.dev
#     port: 8081               # http://127.0.0.1:8081
#     auth: required           # or `none` for something fine to publish
#     viewers:                 # required when auth is required
#       logins:
#         - some-github-user
#       github_orgs:
#         - some-org
services: []
