# Generated by devbox/proxy/bin/generate-traefik-config.sh from services.yaml.
# Do not edit: change the declaration file and run `devbox-proxy reload`.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  filePath: /state/log/traefik.log

accessLog:
  filePath: /state/log/access.log

entryPoints:
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 180s

providers:
  file:
    directory: /state/traefik/dynamic
    watch: true
