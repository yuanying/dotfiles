# Services this devbox publishes on https://<name>.poissonnerie.dev.
#
# One file per host, the way ~/.zshrc.<hostname> is; anietta gets its own.
# Everything here is generated from -- Traefik's routers, the AAAA records and
# the Access applications -- so adding a service is: add it below, run
# sync-cloudflare.sh with a token in the environment, run `devbox-proxy reload`.
#
# Nothing in this file is secret. The audience tags are identifiers that name an
# Access application; the origin key lives under $HOME and the Cloudflare token
# is passed in the environment for one script run. See docs/adr/0004.

zone: poissonnerie.dev

# The Cloudflare Zero Trust team domain, without the scheme. Zero Trust >
# Settings > Custom Pages shows it, and it is the host the login page lives on.
# Required before any service can use auth: required.
team_domain: "yuanying.cloudflareaccess.com"

# Where Cloudflare connects: this container's global IPv6, as passed to
# `docker run --ip6` in start-cuda.
origin: 2405:6581:8580:302::151

defaults:
  # Services that do not say otherwise need a Cloudflare Access login.
  auth: required

# A service name is one DNS label -- llama, not llama.gpu. Universal SSL and a
# wildcard Origin CA certificate both stop at one level (docs/adr/0002).
#
#   - name: llama              # https://llama.poissonnerie.dev
#     port: 8081               # http://127.0.0.1:8081
#     auth: required           # or `none` for something fine to publish
#     aud: ""                  # filled in by sync-cloudflare.sh; commit it
#     viewers:
#       emails:
#         - you@example.com
#       github_orgs:
#         - some-org
services:
  - name: sd-viewer
    port: 8189
    auth: required
    aud: "e7474a278c11995d2e1be19cd7919c6b4a8f66229bec14561fdaee20db0ccdcc"
    viewers:
      emails:
        - yuanying@fraction.jp
