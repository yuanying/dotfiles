# The web apps anietta runs next to its devbox, each in a container of its own.
# Operating them is in README.md next to this file; why they are shaped like
# this is docs/adr/0012.
#
# The project name is the one boucherie's file uses: each host has its own
# Docker, so the two never meet, and the commands in README.md are the same on
# both. Nothing below points into the checkout at run time: the entrypoint is
# baked into the image, and the only mount is $HOME, at the same path the
# devbox sees it.

name: devbox-apps

x-app: &app
  restart: always
  init: true
  # yuanying:staff, as in the devbox, so what the apps write is the user's.
  user: "501:50"
  volumes:
    - /home/yuanying:/home/yuanying
  # Nothing here keeps v6net's other address family on, so the apps are
  # IPv4 only and behind proxyd (docs/adr/0012, revision of 2026-09-13).
  networks:
    v6net: {}

services:
  llama-server:
    <<: *app
    container_name: llama-server
    # Strata (github.com/Niko1221/Strata), built for gfx1151 in the devbox
    # with its own ROCm (AMD TheRock 7.14.1 under ~/opt/strata-rocm), serving
    # the abliterated IQ4_XS GGUF llama.cpp served, through a pack made from
    # it. Kyojin's setup is still in kyojin/, llama.cpp's in llama-server/,
    # and README.md says how to go back. llama-server/STRATA.md has the build,
    # the pack and the measurements.
    build:
      context: strata
    image: devbox-apps-strata
    environment:
      STRATA_ROOT: /home/yuanying/src/github.com/Niko1221/Strata
      STRATA_SDK: /home/yuanying/opt/strata-rocm/install
      STRATA_TOKENIZER: /home/yuanying/models/strata-packs/orca-mradermacher-i1-iq4_xs/tokenizer
      STRATA_MODEL_NAME: qwen3.8-flash-next
      STRATA_LOG: /home/yuanying/.cache/strata/engine.log
      # The Host names besides its own address the server answers (it refuses
      # others, against DNS rebinding): proxyd passes the public name through,
      # and the devbox reaches it as llama-server.
      STRATA_ALLOWED_HOSTS: qwen38.oeilvert.dev,llama-server
      # The CPU picture reader; the GGUF is opened for its vocabulary only.
      STRATA_VISION_MMPROJ: /home/yuanying/models/qwen3.8-flash-next/Qwen3.8-Flash-Next-Uncensored.mmproj-f16.gguf
      STRATA_VISION_MODEL: /home/yuanying/models/qwen3.8-flash-next/Qwen3.8-Flash-Next-Uncensored.i1-IQ4_XS.gguf
      # The prompt GEMM table for this ROCm's hipBLASLt.
      STRATA_HIPBLASLT_TUNING: /home/yuanying/src/github.com/Niko1221/Strata/tools/hip/gfx1151-hipblaslt-100401.txt
      # docs/STRIX_HALO.md's fast configuration. All but the last two round
      # differently from the engine's default path.
      STRATA_PF_FUSED: "1"
      STRATA_IGPU_PROMPT_SET: "1"
      STRATA_PF_SWITCH_MIN_T: "4096"
      STRATA_PREFILL_STREAM_MIN: "128"
      STRATA_PF_F16: "1"
      STRATA_SH_STREAM: "1"
      STRATA_REFILL_PARTS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
    devices:
      - /dev/kfd
      - /dev/dri
    # simone's video and render groups, which own the devices above. They are
    # the host's GIDs, not names: the image has no groups by those numbers.
    group_add:
      - "44"
      - "993"
    ipc: host
    # The engine's arguments, as measured with the CPU capped at 3 GHz.
    command:
      - --pack
      - /home/yuanying/models/strata-packs/orca-mradermacher-i1-iq4_xs
      - --native
      - /home/yuanying/models/qwen3.8-flash-next/Qwen3.8-Flash-Next-Uncensored.i1-IQ4_XS.gguf
      - --ple-gguf
      - /home/yuanying/models/qwen3.8-flash-next/Qwen3.8-Flash-Next-Uncensored.i1-IQ4_XS.gguf
      - --expert-profile
      - /home/yuanying/src/github.com/Niko1221/Strata/data/expert-profile.bin
      # Every expert (61 GiB) in the GPU's cache, read from the GGUF through
      # the file cache: no RAM arena beside it and no expert left to the CPU,
      # whose pool drove it to 98 °C with a partial cache.
      - --expert-cache
      - "24576"
      - --mmap-experts
      - --prefill
      - "16384"
      - --spec
      - "4"
      - --spec-min-p
      - "0.5"
      - --mtp
      - /home/yuanying/models/strata-mtp/rt
      - --mtp-q4
      - all
      - --lookup-chain
      - "3"
      - --mtp-window
      - "8192"
      - --max-context
      - "262144"
      - --kv
      - int8

networks:
  # Created on simone's regied bridge by net-fraction-private, not by compose:
  # the devbox is on it too, and must not lose it to a `docker compose down`.
  v6net:
    external: true
