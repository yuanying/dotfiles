# The web apps anietta runs next to its devbox, each in a container of its own.
# Operating them is in README.md next to this file; why they are shaped like
# this is docs/adr/0012.
#
# The project name is the one boucherie's file uses: each host has its own
# Docker, so the two never meet, and the commands in README.md are the same on
# both. Nothing below points into the checkout at run time: the entrypoint is
# baked into the image, and the only mount is $HOME, at the same path the
# devbox sees it.

name: devbox-apps

x-app: &app
  restart: always
  init: true
  # yuanying:staff, as in the devbox, so what the apps write is the user's.
  user: "501:50"
  volumes:
    - /home/yuanying:/home/yuanying
  # Nothing here keeps v6net's other address family on, so the apps are
  # IPv4 only and behind proxyd (docs/adr/0012, revision of 2026-09-13).
  networks:
    v6net: {}

services:
  llama-server:
    <<: *app
    container_name: llama-server
    # Kyojin, Yamz Labs' engine built on ExLlamaV3 for Strix Halo, with its
    # built extension and venv under ~/opt/kyojin. The llama.cpp setup this
    # replaced is still in llama-server/, and README.md says how to go back.
    build:
      context: kyojin
    # Not the devbox-apps-llama-server compose would name it after the
    # service: that one is llama.cpp's, kept so that going back to it needs
    # no build.
    image: devbox-apps-kyojin
    working_dir: /home/yuanying/opt/kyojin/src
    environment:
      EXL3_VENV: /home/yuanying/opt/kyojin/venv
      EXL3_ROCM_SDK: /home/yuanying/opt/kyojin/venv/lib/python3.12/site-packages/_rocm_sdk_devel
      # The weights are already abliterated (the same source as the IQ4_XS
      # llama.cpp served), so no runtime uncensor projection on top. "off"
      # rather than unset, so nothing inherited can turn one on.
      EXL3_ABLIT_RUNTIME: "off"
      # Read the n-gram embedding table from the file instead of holding it in
      # RAM. In RAM, the server's pages went to swap while the weights loaded.
      EXL3_NGRAM_STREAM: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
      # As measured.
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    devices:
      - /dev/kfd
      - /dev/dri
    # simone's video and render groups, which own the devices above. They are
    # the host's GIDs, not names: the image has no groups by those numbers.
    group_add:
      - "44"
      - "993"
    ipc: host
    command:
      - --model
      - /home/yuanying/models/qwen3.8-flash-next-exl3-uncensored-lygo-4bpw-9c715c0b
      - --model-id
      - qwen3.8-flash-next
      # The model's native length, in one pool of KV pages that both sessions
      # draw from: a second session costs little more than its GDN state.
      - --ctx
      - "262144"
      - --sessions
      - "2"
      # fp16 pages. The 8-bit ones save 2.6 GiB at 256K (serve.py's figure) but
      # do not give the same output for a request run alongside another.
      - --cache-bits
      - "0"
      - --draft-policy
      - mix
      - --chat-template
      - /home/yuanying/models/qwen3.8-flash-next-exl3-uncensored-lygo-4bpw-9c715c0b/chat_template.jinja
      # The template's own default, which is also what llama.cpp got from the
      # GGUF's template. serve.py would otherwise ask for medium.
      - --default-reasoning-effort
      - xhigh
      - --slot-save-path
      - /home/yuanying/.cache/kyojin/slots
      - --host
      - 0.0.0.0
      - --port
      - "8082"

networks:
  # Created on simone's regied bridge by net-fraction-private, not by compose:
  # the devbox is on it too, and must not lose it to a `docker compose down`.
  v6net:
    external: true
