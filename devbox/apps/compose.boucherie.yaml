# The web apps boucherie runs next to its devbox, each in a container of its
# own. Operating them is in README.md next to this file; why they are shaped
# like this is docs/adr/0012.
#
# The project name is fixed so that whichever checkout runs `docker compose`
# manages the same containers. Nothing below points into the checkout at run
# time: the entrypoints are baked into the images, and the only mounts are
# $HOME and /mnt, at the same paths the devbox sees them -- except for vmapi,
# which says why below.

name: devbox-apps

x-app: &app
  restart: always
  init: true
  # yuanying:staff, as in the devbox, so what the apps write is the user's.
  user: "501:50"
  volumes:
    - /home/yuanying:/home/yuanying
    - /mnt:/mnt
  # Nothing here keeps v6net's other address family on, so the apps are
  # IPv4 only and behind proxyd (docs/adr/0012, revision of 2026-09-13).
  networks:
    v6net: {}

services:
  sd-webui:
    <<: *app
    container_name: sd-webui
    build:
      context: sd-webui
    working_dir: /home/yuanying/src/github.com/yuanying/sd-webui-forge-neo
    command:
      - --listen
      - --port
      - "7860"
      - --api
      - --uv
      - --model-ref
      - /mnt/data/sd-webui/models
    # As in the devbox it used to run in.
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sd-viewer:
    <<: *app
    container_name: sd-viewer
    build:
      context: sd-viewer
    working_dir: /home/yuanying/src/github.com/yuanying/sd-viewer
    # Everything else comes from ~/.config/sd-viewer/config.toml, which the
    # devbox shares; only the address of sd-webui differs in here.
    command:
      - --webui-url
      - http://sd-webui:7860

  tageditor:
    <<: *app
    container_name: tageditor
    build:
      context: tageditor
    working_dir: /home/yuanying/src/github.com/iwaco/tageditor
    environment:
      TAGEDITOR_ALLOWED_HOSTS: tageditor.poissonnerie.dev

  # Static pages comparing LoRA versions, written by sd-scripts'
  # outputs/compare/build.py.
  lora-compare:
    <<: *app
    container_name: lora-compare
    build:
      context: lora-compare
    working_dir: /home/yuanying/src/github.com/kohya-ss/sd-scripts/outputs/images

  # Picks LoRA training images out of the lora_datasets repository and
  # generates sd-scripts settings. It writes datasets into the checkout but
  # never commits.
  lora-datasets:
    <<: *app
    container_name: lora-datasets
    build:
      context: lora-datasets
    working_dir: /home/yuanying/src/github.com/yuanying/lora_datasets

  # The VM API on qemu:///system (github.com/yuanying/vmapi). It is shaped
  # unlike the apps above on purpose:
  #
  # - It is not built here. vmapi releases its own image, and Renovate's
  #   compose manager moves the tag below; the apps above are built because
  #   they run checkouts under $HOME, which vmapi does not have.
  # - It does not take x-app's mounts. Whatever can write to libvirt's socket
  #   is root on the host (vmapi's docs/adr/0008), so it sees only what it
  #   uses: the socket, the disk directory at the path libvirt opens it by,
  #   and its settings, read only. Not $HOME, not the rest of /mnt. It is
  #   written out rather than merged from x-app for the same reason.
  vmapi:
    container_name: vmapi
    image: ghcr.io/yuanying/vmapi:v0.1.0
    restart: always
    init: true
    # yuanying:staff, who owns /mnt/data/vmapi, plus boucherie's libvirt
    # group, which owns the socket (root:libvirt 0660). A GID, not a name:
    # the image has no group by that name.
    user: "501:50"
    group_add:
      - "112"
    # The long form, to keep Docker from making a missing source as root:
    # the container then fails to start instead of writing where it cannot.
    volumes:
      # The directory rather than the socket: a socket bound by itself is
      # left behind when libvirtd makes it again.
      - type: bind
        source: /var/run/libvirt
        target: /var/run/libvirt
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/data/vmapi
        target: /mnt/data/vmapi
        bind:
          create_host_path: false
      # Not in this repository (vmapi's docs/adr/0009); README.md says what
      # goes in it.
      - type: bind
        source: /home/yuanying/.config/vmapi
        target: /home/yuanying/.config/vmapi
        read_only: true
        bind:
          create_host_path: false
    command:
      - --config
      - /home/yuanying/.config/vmapi/config.yaml
    # No ports: proxyd reaches it as vmapi:8080, after the login, and passes
    # who it is as X-Devbox-User.
    networks:
      v6net: {}

networks:
  # Created on poissonnerie's regied bridge by net-fraction-private, not by
  # compose: the devbox is on it too, and must not lose it to a
  # `docker compose down`.
  v6net:
    external: true
