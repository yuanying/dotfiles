[sandbox_workspace_write]
# workspace-write のサンドボックスから書き込める場所と、ネットワークの許可。
# ホスト別の設定でキーごと上書きできる。
writable_roots = [
    "/home/yuanying/src",
    "/home/yuanying/.cache",
    "/home/yuanying/.npm",
    "/home/yuanying/.local/share",
    "/home/yuanying/.local/state/herdr-tasks",
]
network_access = true

[tui]
# ホスト別設定が無いマシンのデフォルト。
theme = "solarized-dark"

[features]
# Codex 0.157+ は全セッションを 1 つの共有バックグラウンドサーバーで動かし、
# Moshi からはどのペインのセッションか見分けられなくなる (承認や返信が別の
# ペインに飛ぶ)。moshi-hook install はこれを切るか対話で聞いてくるので、
# ここで先に切っておく。bin/setup.sh はこのマージを moshi-hook より先に流す。
daemon_auto_start = false
