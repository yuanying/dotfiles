# herdr configuration (augusta)
# ~/.config/herdr/config.toml (bin/setup.sh から symlink)
#
# herdr は設定ファイルを 1 本しか読まず、include の仕組みも無いため、
# ホストごとに完全な設定を置いて setup.sh が hostname で symlink を張る。
# 共通設定を変えるときは config.toml と各ホストのファイルを揃えること。
#
# 設定 UI (prefix+s) の変更はこのファイルに書き戻される。ホストごとに
# ファイルが分かれているので、他ホストの設定を上書きすることはない。
#
# 既定値は `herdr --default-config` で確認できる。
# ここには tmux.conf から引き継いだ設定と、明示的に変えたい項目だけを書く。

# 初回起動時の通知セットアップは選択済み。
onboarding = false

[keys]
# tmux の `set -g prefix C-q` に合わせる。
# これ以外のキーは herdr のデフォルトのまま使う:
#   prefix+h/j/k/l ペイン移動   prefix+v 左右分割   prefix+- 上下分割
#   prefix+c 新規タブ           prefix+q デタッチ   prefix+s 設定
#   prefix+r リサイズモード     prefix+shift+r 設定リロード
#   prefix+e スクロールバックを $EDITOR で開く
#
# NOTE: tmux の prefix と同じキーなので、herdr は tmux の中ではなく
#       ターミナル直下で起動すること。
prefix = "ctrl+q"

# workspace picker (prefix+w で開く navigate mode) 内は vim 風に j/k で
# ワークスペース選択を上下移動する。navigate mode の j/k はデフォルトで
# ペイン移動に使われているため、玉突きでペイン上下移動はアローキーへ移す
# (左右移動は元々矢印キーも常に有効)。
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# hunk プラグイン (jhochenbaum.hunkdiff) のレビュー操作。プラグインには
# setup-keys アクションがあるが、これはこのファイル (dotfiles の実体) を
# 直接書き換えてバックアップまで置いていくので使わず、同じ内容を手で持つ。
# 他のアクション (コメント間の移動、pager 設定など) は
# `herdr plugin action invoke <action> --plugin jhochenbaum.hunkdiff` で叩く。
[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review"
description = "hunk: review changes"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.send-review"
description = "hunk: send review to agent"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:commit"
description = "hunk: review the last commit"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "jhochenbaum.hunkdiff.review:staged"
description = "hunk: review staged changes"

# herdr-navigator。ワークスペース / エージェント / プロジェクト / セッション /
# ディレクトリを 1 つの fuzzy picker から辿る。開いているワークスペースがあれば
# 新規作成せずそこへフォーカスする。
# 他にも open-side (常設サイドペイン) と jump-back (直前のワークスペースへ
# 戻る) があるが、今のところ overlay だけ割り当てる。
# prefix+t は herdr のデフォルトでは未使用 (prefix+shift+t がタブ名変更)。
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator: jump to anything"

# Navigator 自体には Agent フィルタで開く action が無いため、open 後に
# Ctrl-U (既存の検索をクリア) と Ctrl-A (Agents) を送るラッパーを使う。
# prefix+a は herdr のデフォルトでは未使用。
[[keys.command]]
key = "prefix+a"
type = "shell"
command = "$HOME/bin/herdr-navigator-agents"
description = "navigator: list agents"

[terminal]
# tmux の `split-window -c '#{pane_current_path}'` 相当。
# 新しいペイン/タブ/ワークスペースは呼び出し元の cwd を引き継ぐ。
new_cwd = "follow"

[theme]
# Mona Lisa (Ghostty の組み込みテーマ) の配色。herdr に Mona Lisa は無いので、
# 下の [theme.custom] で全部の色を上書きする。name は上書きが漏れたときの
# 受け皿 (今後 herdr に色の項目が増えたときなど)。
# Claude Code / Codex / pi / nvim のテーマ (monalisa / mona-lisa) と同じパレット。
name = "catppuccin"

# ホスト端末の light/dark には追従せず、上の name で固定する。
auto_switch = false

[theme.custom]
# tmux の `set -g status-style bg=default` 相当。
# パネルは端末側の背景を使い、サイドバーはテーマの背景色で塗る。
panel_bg = "reset"
sidebar_bg = "#120b0d"

# 暗い茶色の背景に黄色の文字。Ghostty のパレットの明るい側の色を使う。
accent = "#ff9566"         # オレンジ
active_row_bg = "#24130e"
selection_bg = "#522917"
surface0 = "#24130e"
surface1 = "#522917"
surface_dim = "#120b0d"
overlay0 = "#6e5c32"
overlay1 = "#a78f49"
text = "#f7d66a"
subtext0 = "#a78f49"
mauve = "#ff5b6a"
green = "#b4b264"
yellow = "#f7d75c"
red = "#ff4331"
blue = "#9eb2b4"
teal = "#8acd8f"
peach = "#ff9566"

[ui]
# 他ホストの accent (zenburn の colour109) は入れない。アクセントは上の
# [theme.custom] で Mona Lisa のオレンジにしている。

# タブ作成時に名前を聞かない。名前なしタブのラベルは表示位置の連番に
# なるだけで cwd もターミナルタイトルも参照されないため、実際の命名は
# zsh.d/extentions/herdr.zsh の herdr_auto_tab_name が行う。
prompt_new_tab_name = false

# エージェントパネルはスペースでまとめず、優先度順に並べる。
agent_panel_sort = "priority"

# Claude Code はターミナルタイトルにセッション名を出すので、それを
# エージェント行に表示する。既定の行は state_icon/workspace/tab と agent
# だけで、セッション名にあたるトークンを含んでいない。
# herdr のセッション名 (HERDR_SESSION) を出すトークンは存在しないため、
# そちらは引き続きウィンドウタイトルへ送っている (zsh.d/extentions/herdr.zsh)。
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[experimental]
# tmux の `allow-passthrough on` 相当。image.nvim などの
# Kitty graphics を herdr 経由で描画する (Ghostty は対応済み)。
kitty_graphics = true

# prefix モード中だけ ASCII 入力ソースに切り替える。
# 日本語入力が有効なままでも prefix コマンドが通るようになる。
switch_ascii_input_source_in_prefix = true

# 自前でカーソルを描く TUI (Claude Code など) でも、macOS の
# 変換候補ウィンドウがカーソル位置を追従できるようにする。
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]

[advanced]
# tmux の `history-limit 1000000` 相当。herdr は行数ではなくバイト数指定。
scrollback_limit_bytes = 100000000
